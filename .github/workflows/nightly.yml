name: Nightly degree day ETL

on:
  schedule:
    - cron: "0 8 * * *"      # 08:00 UTC = 3–4 AM Eastern
  workflow_dispatch:           # allow manual runs from Actions UI

jobs:
  etl:
    runs-on: ubuntu-latest

    permissions:
      contents: write          # needed to commit data/ back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL
        run: python etl.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: nightly degree day update $(date -u +%Y-%m-%d)"
          git push
